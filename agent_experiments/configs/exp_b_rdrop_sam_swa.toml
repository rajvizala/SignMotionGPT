notes = "Exp A plus SWA to target flatter optima and reduce seed variance."

[data]
sentence_json = "/path/to/how2sign_sentence_tokens.json"
word_json = "/path/to/asl_citizen_word_tokens.json"
output_dir = "./agent_experiments/outputs/exp_b_rdrop_sam_swa"
max_seq_len = 256
seed = 42
split_seed = 123
val_ratio = 0.1

[model]
model_name = "Qwen/Qwen3-0.6B"
vqvae_ckpt = "/path/to/word_level_vqvae.pt"
use_bfloat16 = true
grad_checkpointing = true

[training]
epochs = 40
batch_size = 16
lr = 2e-5
weight_decay = 0.01
grad_accum = 1
max_grad_norm = 1.0
warmup_ratio = 0.05
num_workers = 4
eval_every_steps = 200
save_every_steps = 500
max_steps = -1
replay_ratio = 0.0

[regularization]
label_smoothing = 0.05
rdrop_alpha = 1.0
use_rdrop = true
use_sam = true
sam_rho = 0.05
use_swa = true
swa_start_ratio = 0.7
ewc_lambda = 0.0
ewc_samples = 2048
use_ewc = false

[validation]
group_by = ["motion_length_bucket", "text_length_bucket", "lexical_richness_bucket"]
early_stop_patience = 8
select_by = "worst_group_dtw_jpe_proxy"

